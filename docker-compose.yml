version: "3.9"

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.4
    container_name: inventory-mysql
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - inventory-network

  # Nginx Reverse Proxy Service
  nginx:
    image: nginx:latest
    container_name: inventory-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - flask
    networks:
      - inventory-network

  # Flask Application Service
  flask:
    build: .
    image: inventory-app:latest
    container_name: inventory-flask
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DB}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      SECRET_KEY: ${SECRET_KEY}
    expose:
      - "5000"
    depends_on:
      - mysql
    networks:
      - inventory-network

# Top-level Volumes definition for MySQL persistence
volumes:
  mysql-data:

# Top-level Network definition for container communication
networks:
  inventory-network:
    driver: bridge
