<!DOCTYPE html>
<html>

<head>

<title>Edit Product</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<h1>Edit Product</h1>

<form method="POST">

<p>

Name

<br>

<input
type="text"
name="name"
value="{{ product[1] }}"
required>

</p>

<p>

Category

<br>

<input
type="text"
name="category"
value="{{ product[2] }}"
required>

</p>

<p>

Price

<br>

<input
type="number"
step="0.01"
name="price"
value="{{ product[3] }}"
required>

</p>

<p>

Quantity

<br>

<input
type="number"
name="quantity"
value="{{ product[4] }}"
required>

</p>

<button type="submit">

Update Product

</button>

</form>

<br>

<a href="{{ url_for('home') }}">

Back

</a>

</body>

</html>
