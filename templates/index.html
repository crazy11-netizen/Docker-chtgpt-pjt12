<!DOCTYPE html>
<html>

<head>

    <title>Inventory Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<h1>Inventory Management System</h1>

<p>
    <a href="{{ url_for('add') }}">
        ➕ Add Product
    </a>
</p>

<h2>Products</h2>

<table border="1" cellpadding="10">

<tr>

<th>ID</th>

<th>Name</th>

<th>Category</th>

<th>Price</th>

<th>Quantity</th>

<th>Actions</th>

</tr>

{% for product in products %}

<tr>

<td>{{ product[0] }}</td>

<td>{{ product[1] }}</td>

<td>{{ product[2] }}</td>

<td>{{ product[3] }}</td>

<td>{{ product[4] }}</td>

<td>

<a href="{{ url_for('edit', id=product[0]) }}">
Edit
</a>

|

<a href="{{ url_for('delete', id=product[0]) }}"
onclick="return confirm('Delete this product?')">

Delete

</a>

</td>

</tr>

{% endfor %}

</table>

</body>

</html>
