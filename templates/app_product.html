<!DOCTYPE html>
<html>

<head>

    <title>Add Product</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<h1>Add Product</h1>

<form method="POST">

    <p>
        Product Name
        <br>
        <input type="text"
               name="name"
               required>
    </p>

    <p>
        Category
        <br>
        <input type="text"
               name="category"
               required>
    </p>

    <p>
        Price
        <br>
        <input type="number"
               step="0.01"
               name="price"
               required>
    </p>

    <p>
        Quantity
        <br>
        <input type="number"
               name="quantity"
               required>
    </p>

    <button type="submit">
        Save Product
    </button>

</form>

<br>

<a href="{{ url_for('home') }}">
    Back to Products
</a>

</body>

</html>
